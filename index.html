<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zikr Counter</title>
  <style>
    :root{
      --bg:#f5f7fa;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --btn:#f3f4f6;
      --btnText:#111827;
      --primary:#2563eb;
      --primary2:#60a5fa;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px;
      color: var(--text);
    }
    .card{
      width: min(420px, 92vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: var(--shadow);
      text-align:center;
    }
    h1{
      margin: 0 0 10px;
      font-size: 36px;
      letter-spacing: 0.3px;
    }
    .phrase{
      font-size: 22px;
      font-weight: 600;
      margin: 4px 0 18px;
    }
    .count{
      font-size: 56px;
      font-weight: 800;
      margin: 6px 0;
      line-height: 1;
    }
    .row{
      display:flex;
      gap: 12px;
      justify-content:center;
      align-items:center;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    button{
      padding: 12px 18px;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--btnText);
      cursor:pointer;
      min-width: 110px;
    }
    button:active{ transform: translateY(1px); }
    .primary{
      background: var(--primary);
      border-color: var(--primary);
      color:white;
    }
    .small{
      min-width: auto;
      padding: 10px 12px;
      font-size: 16px;
    }
    .meta{
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    /* Target input */
    .target-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .target-label{
      color: var(--muted);
      font-size: 14px;
    }
    input[type="number"]{
      width: 120px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 16px;
      outline: none;
    }
    input[type="number"]:focus{
      border-color: var(--primary2);
      box-shadow: 0 0 0 4px rgba(96,165,250,0.25);
    }

    /* Progress bar */
    .progress-wrap{
      margin-top: 18px;
      text-align:left;
    }
    .progress-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .progress-bar{
      width: 100%;
      height: 12px;
      background: #eef2ff;
      border-radius: 999px;
      overflow:hidden;
      border: 1px solid #e0e7ff;
    }
    .progress-fill{
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      border-radius: 999px;
      transition: width 180ms ease;
    }
    .done{
      margin-top: 10px;
      color: #047857;
      font-weight: 700;
      font-size: 14px;
      display:none;
    }
    .hint{
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Zikr Counter</h1>
    <div class="phrase" id="phrase">SubhanAllah</div>

    <div class="count" id="count">0</div>

    <div class="target-wrap">
      <div class="target-label">Target</div>
      <input id="targetInput" type="number" min="1" step="1" />
      <button class="small" id="applyTargetBtn">Apply</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-top">
        <div id="progressText">0 / 100</div>
        <div id="progressPercent">0%</div>
      </div>
      <div class="progress-bar" aria-label="Progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="done" id="doneMsg">MashaAllah — target completed ✅</div>
    </div>

    <div class="row">
      <button class="primary" onclick="increment()">+1</button>
      <button onclick="resetCount()">Reset</button>
    </div>

    <div class="hint">
      Tip: Your count + target are saved on this device (even after refresh).
    </div>
  </div>

  <script>
    // Storage keys
    const KEY_COUNT = "zikr_count_v1";
    const KEY_TARGET = "zikr_target_v1";

    // State
    let count = 0;
    let target = 100;

    // Elements
    const countEl = document.getElementById("count");
    const targetInputEl = document.getElementById("targetInput");
    const progressTextEl = document.getElementById("progressText");
    const progressPercentEl = document.getElementById("progressPercent");
    const progressFillEl = document.getElementById("progressFill");
    const doneMsgEl = document.getElementById("doneMsg");
    const applyTargetBtn = document.getElementById("applyTargetBtn");

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function loadSaved(){
      const savedCount = localStorage.getItem(KEY_COUNT);
      const savedTarget = localStorage.getItem(KEY_TARGET);

      if (savedCount !== null && !isNaN(Number(savedCount))) {
        count = Number(savedCount);
      }
      if (savedTarget !== null && !isNaN(Number(savedTarget))) {
        target = clamp(Math.floor(Number(savedTarget)), 1, 1000000);
      }

      targetInputEl.value = target;
      render();
    }

    function save(){
      localStorage.setItem(KEY_COUNT, String(count));
      localStorage.setItem(KEY_TARGET, String(target));
    }

    function render(){
      countEl.textContent = count;

      const pct = target > 0 ? clamp(Math.round((count / target) * 100), 0, 100) : 0;
      progressTextEl.textContent = `${count} / ${target}`;
      progressPercentEl.textContent = `${pct}%`;
      progressFillEl.style.width = pct + "%";

      if (count >= target) {
        doneMsgEl.style.display = "block";
      } else {
        doneMsgEl.style.display = "none";
      }
    }

    function increment(){
      count += 1;
      save();
      render();
    }

    function resetCount(){
      count = 0;
      save();
      render();
    }

    function applyTarget(){
      const val = Number(targetInputEl.value);
      if (!Number.isFinite(val) || val < 1) {
        targetInputEl.value = target; // revert
        return;
      }
      target = clamp(Math.floor(val), 1, 1000000);
      targetInputEl.value = target;
      save();
      render();
    }

    // Apply target button + Enter key
    applyTargetBtn.addEventListener("click", applyTarget);
    targetInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") applyTarget();
    });

    // Init
    loadSaved();
  </script>
</body>
</html>
